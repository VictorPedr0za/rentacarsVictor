# Backend y frontend en TU computador (Docker); la base de datos es DynamoDB REAL en AWS.
# No hay servicio de base de datos: las tablas viven en AWS y se crean solas al arrancar.
# Las credenciales de AWS salen del archivo .env (ver .env.example); nunca se suben a GitHub.
#
# Pasos:
#   1. ./mvnw clean package -DskipTests        (genera target/rentacars-0.0.1-SNAPSHOT.jar)
#   2. copiar .env.example a .env y poner tus credenciales de AWS
#   3. docker compose -f docker-compose.cloud.yml up --build
#
# Backend:  http://localhost:8080   (Swagger en /swagger-ui.html)
# Frontend: http://localhost:8081
#
# OJO: usa los mismos puertos que docker-compose.yml; apaga uno antes de encender el otro.
services:
  app:
    build: .
    container_name: rentacars-cloud-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Falta AWS_ACCESS_KEY_ID en el archivo .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Falta AWS_SECRET_ACCESS_KEY en el archivo .env}
      APP_DYNAMODB_REGION: ${AWS_REGION:-us-east-1}
      APP_DYNAMODB_TABLE_PREFIX: ${DYNAMODB_TABLE_PREFIX:-rentacars_}

  frontend:
    build: ./frontend
    container_name: rentacars-cloud-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8081:80"
