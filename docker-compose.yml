# Todo en tu computador con Docker: base de datos DynamoDB LOCAL + backend + frontend.
#
#   1. ./mvnw clean package -DskipTests        (genera target/rentacars-0.0.1-SNAPSHOT.jar)
#   2. docker compose up --build
#
# Backend:  http://localhost:8080   (Swagger en /swagger-ui.html)
# Frontend: http://localhost:8081
# DynamoDB local: http://localhost:8000
#
# Para usar DynamoDB REAL en AWS en lugar de la local: docker-compose.cloud.yml
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: rentacars-dynamodb
    restart: unless-stopped
    # -sharedDb + -dbPath: los datos se guardan en el volumen y sobreviven entre reinicios
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  app:
    build: .
    container_name: rentacars-container
    # si la app arranca antes que DynamoDB, Docker la reinicia hasta que la base responda
    restart: unless-stopped
    depends_on:
      - dynamodb
    ports:
      - "8080:8080"
    environment:
      # con endpoint la app usa DynamoDB local (sin cuenta ni credenciales de AWS)
      APP_DYNAMODB_ENDPOINT: http://dynamodb:8000

  frontend:
    build: ./frontend
    container_name: rentacars-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8081:80"

volumes:
  dynamodb_data:
