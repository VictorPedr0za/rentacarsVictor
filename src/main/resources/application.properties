spring.application.name=rentacars

# ============================================================
#  BASE DE DATOS: AMAZON DYNAMODB (NoSQL)
#  Reemplaza a PostgreSQL + JPA/Hibernate. No hay usuario ni clave de
#  base de datos: DynamoDB se accede con credenciales de AWS (IAM).
#
#  app.dynamodb.endpoint
#     (vacio)                 -> DynamoDB REAL en AWS. Las credenciales las toma
#                                el SDK solo: variables AWS_ACCESS_KEY_ID /
#                                AWS_SECRET_ACCESS_KEY, archivo ~/.aws/credentials
#                                o el rol de la maquina (EC2, App Runner...).
#     http://localhost:8000   -> DynamoDB LOCAL (Docker o scripts/iniciar-dynamodb-local).
#                                Se activa con:  --spring.profiles.active=local
#
#  Cualquiera de estos valores se puede cambiar con variables de entorno,
#  por ejemplo APP_DYNAMODB_REGION=us-east-2 o APP_DYNAMODB_ENDPOINT=http://...
# ============================================================
app.dynamodb.region=us-east-1
app.dynamodb.endpoint=
# prefijo de las tablas: rentacars_tiendas, rentacars_autos, ...
app.dynamodb.table-prefix=rentacars_
# crea las tablas al arrancar si no existen
app.dynamodb.auto-create=true
# carga datos de ejemplo solo si las tablas estan vacias
app.dynamodb.seed=true

# ============================================================
#  JSON (Jackson)
#  SNAKE_CASE traduce automaticamente los nombres de los campos:
#     Java               JSON
#     idTienda        -> "id_tienda"
#     precioDia       -> "precio_dia"
#     fechaInicio     -> "fecha_inicio"
#     tarjetaCredito  -> "tarjeta_credito"
#
#  Gracias a esto NO hay que poner @JsonProperty en ningun DTO.
#  En Java se escribe camelCase (lo normal); el JSON sale como
#  lo pide el backlog. No cambien esta linea.
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE

# No incluir en el JSON los campos que esten en null
spring.jackson.default-property-inclusion=non_null

# ============================================================
#  SWAGGER / OPENAPI
#  Con el proyecto corriendo, abrir en el navegador:
#     http://localhost:8080/swagger-ui.html
#  Sirve para probar los endpoints sin instalar Postman.
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
#  CORS
#  Origenes desde donde el navegador puede llamar a la API
#  (el frontend de docker-compose corre en el puerto 8081).
#  Varios origenes se separan con coma.
# ============================================================
# localhost y 127.0.0.1 (cualquier puerto) ya estan permitidos; aqui van direcciones extra, p. ej. la de una pagina publicada
app.cors.allowed-origins=

# Puerto de la aplicacion
server.port=8080
