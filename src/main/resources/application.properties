spring.application.name=rentacars

# ============================================================
#  CONEXION A POSTGRESQL
#  La base y el usuario se crean con script_bd.sql (raiz del proyecto).
#  Si tu usuario o clave son distintos, cambialos SOLO en tu computador
#  y no subas ese cambio a GitHub.
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/alquilerautos_db
spring.datasource.username=cloud_usr
spring.datasource.password=cloud_pwd
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  HIBERNATE / JPA
#
#  ddl-auto=validate  ->  El SCRIPT SQL manda. Hibernate NO crea ni
#                         modifica tablas: solo revisa al arrancar que
#                         cada @Entity coincida con su tabla real.
#                         Si no coinciden, la app no arranca y dice
#                         exactamente cual columna esta mal. Es lo que
#                         queremos: enterarnos al instante, no a mitad
#                         de una peticion.
#
#  Si alguien necesita cambiar la estructura de una tabla:
#     1. Modifica script_bd.sql
#     2. Lo corre de nuevo
#     3. Ajusta la @Entity
#     4. Avisa al grupo
#  Nunca al reves.
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Muestra en la consola el SQL que Hibernate ejecuta (util para aprender y depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita un warning ruidoso al arrancar
spring.jpa.open-in-view=false

# ============================================================
#  JSON (Jackson)
#  SNAKE_CASE traduce automaticamente los nombres de los campos:
#     Java               JSON
#     idTienda        -> "id_tienda"
#     precioDia       -> "precio_dia"
#     fechaInicio     -> "fecha_inicio"
#     tarjetaCredito  -> "tarjeta_credito"
#
#  Gracias a esto NO hay que poner @JsonProperty en ningun DTO.
#  En Java se escribe camelCase (lo normal); el JSON sale como
#  lo pide el backlog. No cambien esta linea.
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE

# No incluir en el JSON los campos que esten en null
spring.jackson.default-property-inclusion=non_null

# ============================================================
#  SWAGGER / OPENAPI
#  Con el proyecto corriendo, abrir en el navegador:
#     http://localhost:8080/swagger-ui.html
#  Sirve para probar los endpoints sin instalar Postman.
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Puerto de la aplicacion
server.port=8080
